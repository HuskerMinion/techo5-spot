# The Echo Spot (rook), read by etc/techo5/boot.sh and tools/linux/mkrootfs.sh in TECHO5.
DATA_DEV=/dev/mmcblk0p13
STORE_DEV=/dev/mmcblk0p11
# Broadcom BCM43569 over USB; firmware_path and nvram_path default to /vendor/firmware.
WIFI_MODULE=/vendor/lib/modules/amzn-bcmdhd.ko
# Bluetooth: the same BCM43569A2 as H4 on a UART. No module; btbridge powers it (rfkill), loads the
# patch, runs the UART at 3 Mbit/s and hands it to the kernel through /dev/vhci. Needs the kernel from
# tools/linux/build-kernel.sh (the LineageOS one has no CONFIG_BT).
BT_MODULE=
BT_UART=/dev/ttyMT1
BT_HCD=/vendor/firmware/BCM43569A2_001.003.004.0142.0191.hcd
BT_BAUD=3000000
T5_PRODUCT="Echo Spot Linux"
